name: "주간 작업 · Agent·Harness"
description: "Runner·Tool·Workflow를 구현하고 공개 가능한 실행 요약을 전달합니다."
title: "[주간][Agent·Harness] "
body:
  - type: markdown
    attributes:
      value: "주간 연결 보드가 이 Issue를 읽습니다. 필드 제목을 유지하고, 담당자는 Assignees로 지정해주세요. 공개 가능한 요약과 링크만 작성하며 개인정보·원시 로그·프롬프트·비공개 정답·인증정보는 포함하지 않습니다."
  - type: dropdown
    id: schema
    attributes:
      label: "양식 버전"
      options:
        - "SAL-WEEKLY-V1"
      default: 0
    validations:
      required: true
  - type: dropdown
    id: week
    attributes:
      label: "주차"
      options:
        - "OT"
        - "W01"
        - "W02"
        - "W03"
        - "W04"
        - "W05"
        - "W06"
        - "W07"
        - "W08"
        - "W09"
        - "W10"
        - "W11"
        - "W12"
        - "W13"
        - "W14"
        - "W15"
        - "W16"
      default: 0
    validations:
      required: true
  - type: dropdown
    id: team
    attributes:
      label: "담당 팀"
      options:
        - "Agent·Harness"
      default: 0
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: "진행 상태"
      options:
        - "미시작"
        - "작성 중"
        - "검토 요청"
        - "공유 완료"
        - "보류"
      default: 0
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: "이번 주 질문·목표"
      description: "이번 주에 확인하거나 결정할 질문을 작성해주세요."
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: "작업·결과 요약"
      description: "구현 변경점·실행 조건·공개 가능한 실행 결과 요약과 코드 PR을 남겨주세요. 원시 로그와 비밀정보는 제외합니다."
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: "자료 링크"
      description: "문서·PR·공개 결과의 http(s) URL을 한 줄에 하나씩 입력해주세요."
    validations:
      required: false
  - type: textarea
    id: depends
    attributes:
      label: "선행 Issue"
      description: "같은 저장소의 #번호 또는 전체 Issue URL만 공백·줄바꿈·쉼표로 구분하세요. 예: #12, #15. 없으면 비워두거나 없음."
    validations:
      required: false
  - type: dropdown
    id: affected
    attributes:
      label: "영향받는 팀"
      description: "아직 구체적인 후속 Issue가 없어도 자료를 전달할 팀을 선택하세요."
      multiple: true
      options:
        - "Task·데이터"
        - "연구·실험 설계"
        - "Evaluation"
        - "Leaderboard"
  - type: textarea
    id: handoff
    attributes:
      label: "전달 내용·요청할 결정"
      description: "어느 팀이 어떤 자료로 무엇을 결정하거나 구현하면 되는지 적어주세요."
    validations:
      required: false
  - type: textarea
    id: next
    attributes:
      label: "다음 주 질문"
      description: "이번 결과에서 이어갈 질문과 아직 확인하지 못한 점을 적어주세요."
    validations:
      required: false
  - type: textarea
    id: done
    attributes:
      label: "완료 기준"
      description: "다른 사람이 어떤 결과를 확인하면 이 작업을 완료로 볼 수 있는지 적어주세요."
    validations:
      required: true
